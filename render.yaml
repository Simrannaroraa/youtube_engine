services:
  - type: web
    name: yt-insight-engine-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Set this manually in Render dashboard
      - key: GEMINI_API_KEY
        sync: false          # Set this manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # Set to your Vercel URL after frontend deploy
                             # e.g. https://your-app.vercel.app
      - key: PYTHON_VERSION
        value: 3.10.13
